<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <filter id="paperGrain">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"/>
    <feDiffuseLighting in="noise" lighting-color="#ffffff" surfaceScale="0.8" result="light">
      <feDistantLight azimuth="45" elevation="65"/>
    </feDiffuseLighting>
    <feBlend mode="multiply" in="SourceGraphic" in2="light"/>
  </filter>
  <rect width="100%" height="100%" fill="#faf9f5"/>
  <rect width="100%" height="100%" filter="url(#paperGrain)" opacity="0.25"/>
</svg>
