<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 68" width="40" height="68" fill="none">
  <!-- Top-down silhouette of an intercity luxury coach / bus -->
  <!-- Side Mirrors -->
  <rect x="2" y="14" width="4" height="7" rx="2" fill="#0a1f17" />
  <rect x="34" y="14" width="4" height="7" rx="2" fill="#0a1f17" />
  
  <!-- Main Chassis -->
  <rect x="6" y="4" width="28" height="60" rx="6" fill="#003b27" stroke="#ffffff" stroke-width="2" />
  
  <!-- Front Windshield (Curved glass) -->
  <path d="M 9 12 C 12 8, 28 8, 31 12 L 31 18 C 28 17, 12 17, 9 18 Z" fill="#99d3b4" />
  
  <!-- Destination display board -->
  <rect x="13" y="6" width="14" height="3" rx="1" fill="#ffdadb" />
  
  <!-- Driver & Front Row Cockpit -->
  <rect x="11" y="20" width="7" height="4" rx="1" fill="#1a533c" />
  <rect x="22" y="20" width="7" height="4" rx="1" fill="#1a533c" />
  
  <!-- Roof AC Units -->
  <rect x="12" y="28" width="16" height="12" rx="3" fill="#1a533c" stroke="#8ed5af" stroke-width="1" />
  <line x1="15" y1="31" x2="25" y2="31" stroke="#8ed5af" stroke-width="1" />
  <line x1="15" y1="34" x2="25" y2="34" stroke="#8ed5af" stroke-width="1" />
  <line x1="15" y1="37" x2="25" y2="37" stroke="#8ed5af" stroke-width="1" />
  
  <!-- Emergency Roof Escape Hatch -->
  <rect x="15" y="45" width="10" height="8" rx="2" fill="#0e5c3e" stroke="#226a4b" stroke-width="1" />
  
  <!-- Rear Window & Engine Louvers -->
  <rect x="9" y="58" width="22" height="3" rx="1" fill="#99d3b4" />
  <!-- Tail Lights -->
  <rect x="7" y="61" width="4" height="2" rx="1" fill="#ba1a1a" />
  <rect x="29" y="61" width="4" height="2" rx="1" fill="#ba1a1a" />
</svg>
